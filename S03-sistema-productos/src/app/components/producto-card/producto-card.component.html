<article class="tarjeta">

  <div class="icono">
    📦
  </div>

  <h3>
    {{ producto.nombre }}
  </h3>

  <p class="precio">
    S/ {{ producto.precio }}
  </p>

  <p>
    Stock: {{ producto.stock }}
  </p>


  <div class="acciones">

    <button
      class="editar"
      (click)="editarProducto()">

      Editar

    </button>


    <button
      class="eliminar"
      (click)="eliminarProducto()">

      Eliminar

    </button>

  </div>

</article>
