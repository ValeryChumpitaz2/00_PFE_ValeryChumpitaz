<section class="formulario">
    <h2> REGISTRAR PRODUCTO </h2>
    <div class="campos">
        <input type="text" placeholder="Nombre del producto" [(ngModel)]="productoForm.nombre">
        <input type="number" placeholder="Precio del producto" [(ngModel)]="productoForm.precio">
        <input type="number" placeholder="Stock del producto" [(ngModel)]="productoForm.stock">
        <button (click)="guardarProducto()">Guardar</button>
    </div>
