<section class="formulario">
    <h2> Nuevo Habito </h2>
    <input type="text" placeholder="Nombre del habito" [(ngModel)]="nuevoHabito.nombre">
    <select [(ngModel)]="nuevoHabito.categoria">
        <option value="Salud">Salud</option>
        <option value ="Estudio">Estudio</option>
        <option value="Trabajo">Trabajo</option>
        <option value="Personal">Personal</option>
    </select>
    <button [disabled]="!nuevoHabito.nombre"(click)="guardarHabito()"> + Agregar Habito</button>

</section>
